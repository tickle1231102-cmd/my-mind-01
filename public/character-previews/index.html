<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>캐릭터 레벨별 미리보기</title>
<style>
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#FDFBF7; color:#4a5248; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#8ba4b4; font-size:13px; margin:0 0 24px; }
  .card { background:#fff; border:1px solid #e8e0d4; border-radius:16px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; color:#6d8a5e; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  figure { margin:0; flex:1; min-width:140px; text-align:center; background:#f7f2ea; border-radius:12px; padding:12px; }
  img { width:100%; max-width:220px; height:auto; }
  figcaption { margin-top:8px; font-size:12px; color:#8ba4b4; }
</style>
</head>
<body>
  <h1>마음의 화분 — 레벨별 캐릭터</h1>
  <p>화분(Sprout) · 뿌리(Root) SVG 미리보기 · public/character-previews/</p>
  
    <div class="card">
      <h3>Lv.0</h3>
      <div class="row">
        <figure><img src="sprout/lv0.svg" alt="화분 Lv0"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv0.svg" alt="뿌리 Lv0"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <h3>Lv.1</h3>
      <div class="row">
        <figure><img src="sprout/lv1.svg" alt="화분 Lv1"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv1.svg" alt="뿌리 Lv1"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <h3>Lv.2</h3>
      <div class="row">
        <figure><img src="sprout/lv2.svg" alt="화분 Lv2"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv2.svg" alt="뿌리 Lv2"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <h3>Lv.3</h3>
      <div class="row">
        <figure><img src="sprout/lv3.svg" alt="화분 Lv3"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv3.svg" alt="뿌리 Lv3"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <h3>Lv.4</h3>
      <div class="row">
        <figure><img src="sprout/lv4.svg" alt="화분 Lv4"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv4.svg" alt="뿌리 Lv4"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
    <div class="card">
      <h3>Lv.5</h3>
      <div class="row">
        <figure><img src="sprout/lv5.svg" alt="화분 Lv5"/><figcaption>화분</figcaption></figure>
        <figure><img src="root/lv5.svg" alt="뿌리 Lv5"/><figcaption>뿌리</figcaption></figure>
      </div>
    </div>
</body>
</html>
